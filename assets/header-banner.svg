<svg width="100%" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b27"/>
      <stop offset="100%" stop-color="#16161e"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="50%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#7dcfff"/>
    </linearGradient>
    <linearGradient id="cometGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="-36" y2="-17">
      <stop offset="0%" stop-color="#e0af68" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e0af68" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="300" fill="url(#skyGrad)"/>

  <circle cx="1130" cy="45" r="22" fill="#e0af68" opacity="0.16" filter="url(#glow)"/>
  <circle cx="1130" cy="45" r="13" fill="#e0af68"/>

  <g fill="#c0caf5">
    <circle cx="40" cy="30" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="50" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.7s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="45" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="250" r="1.3"><animate attributeName="opacity" values="1;0.3;1" dur="3s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="260" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="255" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="2.9s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="240" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="25" r="1.1"><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="30" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.8s" begin="0.2s" repeatCount="indefinite"/></circle>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.15;0.55;0.65;1" dur="5s" begin="0.4s" repeatCount="indefinite"/>
    <animateMotion path="M 100,10 L 620,260" dur="5s" begin="0.4s" repeatCount="indefinite" calcMode="linear"/>
    <line x1="0" y1="0" x2="-36" y2="-17" stroke="url(#cometGrad)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.8" fill="#f4e0b8"/>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.15;0.55;0.65;1" dur="5.6s" begin="2.6s" repeatCount="indefinite"/>
    <animateMotion path="M 700,15 L 1150,235" dur="5.6s" begin="2.6s" repeatCount="indefinite" calcMode="linear"/>
    <line x1="0" y1="0" x2="-36" y2="-17" stroke="url(#cometGrad)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.8" fill="#f4e0b8"/>
  </g>

  <g stroke="#3d59a1" stroke-width="1.2" fill="none" opacity="0.4">
    <path id="lline1" d="M 70,50 L 190,70"/>
    <path id="lline2" d="M 70,50 L 130,130"/>
    <path id="lline3" d="M 130,130 L 50,170"/>
    <path id="lline4" d="M 130,130 L 210,200"/>
    <path id="lline5" d="M 190,70 L 130,130"/>
  </g>
  <g fill="#7aa2f7">
    <circle cx="70" cy="50" r="3.5"/>
    <circle cx="190" cy="70" r="3.5"/>
    <circle cx="50" cy="170" r="3.5"/>
    <circle cx="210" cy="200" r="3.5"/>
    <circle cx="130" cy="130" r="4"/>
  </g>
  <g fill="#7dcfff">
    <circle r="2.2"><animateMotion dur="2.2s" begin="0s" repeatCount="indefinite"><mpath href="#lline1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.2s" begin="0s" repeatCount="indefinite"/></circle>
    <circle r="2.2"><animateMotion dur="2.2s" begin="0.4s" repeatCount="indefinite"><mpath href="#lline2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.2s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle r="2.2"><animateMotion dur="2.2s" begin="0.8s" repeatCount="indefinite"><mpath href="#lline3"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.2s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle r="2.2"><animateMotion dur="2.2s" begin="1.2s" repeatCount="indefinite"><mpath href="#lline4"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.2s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle r="2.2"><animateMotion dur="2.2s" begin="1.6s" repeatCount="indefinite"><mpath href="#lline5"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.2s" begin="1.6s" repeatCount="indefinite"/></circle>
  </g>

  <g stroke="#3d59a1" stroke-width="1.2" fill="none" opacity="0.4">
    <path id="rline1" d="M 1010,60 L 1130,80"/>
    <path id="rline2" d="M 1010,60 L 1070,140"/>
    <path id="rline3" d="M 1070,140 L 1150,180"/>
    <path id="rline4" d="M 1070,140 L 990,210"/>
    <path id="rline5" d="M 1130,80 L 1070,140"/>
  </g>
  <g fill="#bb9af7">
    <circle cx="1010" cy="60" r="3.5"/>
    <circle cx="1130" cy="80" r="3.5"/>
    <circle cx="1150" cy="180" r="3.5"/>
    <circle cx="990" cy="210" r="3.5"/>
    <circle cx="1070" cy="140" r="4"/>
  </g>
  <g fill="#7dcfff">
    <circle r="2.2"><animateMotion dur="2.2s" begin="0.2s" repeatCount="indefinite"><mpath href="#rline1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.2s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle r="2.2"><animateMotion dur="2.2s" begin="0.6s" repeatCount="indefinite"><mpath href="#rline2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.2s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle r="2.2"><animateMotion dur="2.2s" begin="1.0s" repeatCount="indefinite"><mpath href="#rline3"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.2s" begin="1.0s" repeatCount="indefinite"/></circle>
    <circle r="2.2"><animateMotion dur="2.2s" begin="1.4s" repeatCount="indefinite"><mpath href="#rline4"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.2s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle r="2.2"><animateMotion dur="2.2s" begin="1.8s" repeatCount="indefinite"><mpath href="#rline5"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.2s" begin="1.8s" repeatCount="indefinite"/></circle>
  </g>

  <g opacity="0" transform="translate(0,14)">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.15;1" dur="1.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0,14;0,14;0,0" keyTimes="0;0.15;1" dur="1.4s" fill="freeze"/>
    <text x="600" y="150" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="64" font-weight="700" fill="url(#nameGrad)" filter="url(#glow)">Pawan Vaidya</text>
    <text x="600" y="188" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="22" fill="#c0caf5">Full Stack Developer &#8226; AI / LLM Explorer</text>
  </g>

  <rect x="470" y="204" width="0" height="3" rx="1.5" fill="url(#nameGrad)" opacity="0.85">
    <animate attributeName="width" values="0;0;260" keyTimes="0;0.35;1" dur="1.8s" fill="freeze"/>
  </rect>
</svg>
