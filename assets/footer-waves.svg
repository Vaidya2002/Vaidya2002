<svg width="100%" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b27"/>
      <stop offset="100%" stop-color="#16161e"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="200" fill="url(#skyGrad)"/>

  <circle cx="1000" cy="40" r="26" fill="#e0af68" opacity="0.18" filter="url(#glow)"/>
  <circle cx="1000" cy="40" r="16" fill="#e0af68"/>

  <g fill="#c0caf5">
    <circle cx="80" cy="30" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="60" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="25" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="70" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="3s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="460" cy="35" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="55" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="20" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="65" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="75" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.8s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="30" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3s" begin="1.6s" repeatCount="indefinite"/></circle>
  </g>

  <g fill="#24283b" opacity="0.9">
    <path d="M -200,120 C -150,114 -150,114 -100,120 C -50,126 -50,126 0,120 C 50,114 50,114 100,120 C 150,126 150,126 200,120 C 250,114 250,114 300,120 C 350,126 350,126 400,120 C 450,114 450,114 500,120 C 550,126 550,126 600,120 C 650,114 650,114 700,120 C 750,126 750,126 800,120 C 850,114 850,114 900,120 C 950,126 950,126 1000,120 C 1050,114 1050,114 1100,120 C 1150,126 1150,126 1200,120 L 1200,200 L -200,200 Z">
      <animateTransform attributeName="transform" type="translate" values="0,0; -200,0" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="#3d59a1" opacity="0.55">
    <path d="M -200,140 C -150,130 -150,130 -100,140 C -50,150 -50,150 0,140 C 50,130 50,130 100,140 C 150,150 150,150 200,140 C 250,130 250,130 300,140 C 350,150 350,150 400,140 C 450,130 450,130 500,140 C 550,150 550,150 600,140 C 650,130 650,130 700,140 C 750,150 750,150 800,140 C 850,130 850,130 900,140 C 950,150 950,150 1000,140 C 1050,130 1050,130 1100,140 C 1150,150 1150,150 1200,140 L 1200,200 L -200,200 Z">
      <animateTransform attributeName="transform" type="translate" values="0,0; -200,0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <g id="ship-drift">
    <animateTransform attributeName="transform" type="translate" values="-100,0; 1300,0" keyTimes="0;1" dur="16s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,158; 0,152; 0,158; 0,164; 0,158" keyTimes="0;0.25;0.5;0.75;1" dur="2s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-5;5;-5" keyTimes="0;0.5;1" dur="2s" repeatCount="indefinite"/>
        <ellipse cx="-55" cy="5" rx="12" ry="2.2" fill="#7aa2f7" opacity="0.22"/>
        <ellipse cx="-72" cy="6" rx="9" ry="1.6" fill="#7aa2f7" opacity="0.12"/>
        <path d="M -35,0 C -35,10 35,10 35,0 L 26,-6 L -26,-6 Z" fill="#c0caf5"/>
        <path d="M -35,0 C -35,10 35,10 35,0 L 30,3 C 15,8 -15,8 -30,3 Z" fill="#9aa5ce"/>
        <line x1="0" y1="-6" x2="0" y2="-40" stroke="#9aa5ce" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 2,-38 L 2,-10 L 30,-15 Z" fill="#bb9af7"/>
        <path d="M 0,-40 L 10,-37 L 0,-34 Z" fill="#f7768e"/>
      </g>
    </g>
  </g>

  <g fill="#7aa2f7" opacity="0.5">
    <path d="M -200,160 C -150,146 -150,146 -100,160 C -50,174 -50,174 0,160 C 50,146 50,146 100,160 C 150,174 150,174 200,160 C 250,146 250,146 300,160 C 350,174 350,174 400,160 C 450,146 450,146 500,160 C 550,174 550,174 600,160 C 650,146 650,146 700,160 C 750,174 750,174 800,160 C 850,146 850,146 900,160 C 950,174 950,174 1000,160 C 1050,146 1050,146 1100,160 C 1150,174 1150,174 1200,160 L 1200,200 L -200,200 Z">
      <animateTransform attributeName="transform" type="translate" values="0,0; -200,0" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
